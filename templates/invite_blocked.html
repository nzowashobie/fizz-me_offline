{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invite — {{ event_title }}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#0a1929; color:#e2e8f0; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    .card { background:#0f2744; border-radius:20px; padding:40px 32px; text-align:center; max-width:360px; width:90%; }
    .icon { font-size:52px; margin-bottom:16px; }
    h1 { font-size:20px; font-weight:700; margin-bottom:8px; }
    p { font-size:14px; color:#64748b; line-height:1.6; margin-bottom:24px; }
    a { display:inline-block; padding:12px 28px; background:#128c7e; color:#fff; border-radius:12px; text-decoration:none; font-weight:700; font-size:14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔒</div>
    <h1>{{ event_type }}</h1>
    <h2 style="font-size:18px;margin-bottom:12px;">{{ event_title }}</h2>
    <p>You're not on the guest list for this event. Ask the host to invite you, or log in with a different account.</p>
    <a href="{% url 'login-user' %}">Log in to Asterix</a>
  </div>
</body>
</html>
