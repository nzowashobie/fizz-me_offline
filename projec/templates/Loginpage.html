<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asterix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
        }

        .container {
            background: #fff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 350px;
        }

        h2 {
            color: #25D366;
            margin-bottom: 1rem;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            background: #25D366;
            color: white;
            border: none;
            padding: 10px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #1da851;
        }

        .signup-link {
            margin-top: 10px;
            font-size: 14px;
        }

        .signup-link a {
            color: #25D366;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }
        .error-message {
    color: #ff6b6b;
    margin-bottom: 1rem;
    font-size: 14px;
}
    </style>
</head>
<body>

    <div class="container">
        <h2>H! Login</h2>
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div class="error-message">
                    <p>Invalid username or password. Please try again.</p>
                </div>
            {% endif %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
    
        <p class="signup-link">Don't have an account? <a href="{% url 'signup-user' %}">Sign Up</a></p>
    </div>

</body>
</html>
